<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Feedback</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Admin Panel</h1>

        <!-- Login Section -->
        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required value="admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>

        <!-- Feedback Section (hidden by default) -->
        <div id="feedback-section" style="display: none;">
            <h2>Submitted Feedback</h2>
            <a href="admin_log.html" class="btn" style="margin-bottom: 20px; display: inline-block;">View Update Log &rarr;</a>
            <h3 id="average-rating">Overall Performance: Loading...</h3>
            <div class="admin-actions">
                <a href="recycle_bin.html" class="btn">Recycle Bin &rarr;</a>
                <button id="clear-feedback-btn" class="btn btn--danger">Clear All Feedback</button>
            </div>
            <table id="feedback-table">
                <!-- Feedback will be populated here by JavaScript -->
            </table>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
