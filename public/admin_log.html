<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Update Log</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Admin Update Log</h1>
        <p>This page will show a history of all updates made by the admin.</p>
        <a href="admin.html" class="btn" style="margin-bottom: 20px; display: inline-block;">&larr; Back to Feedback</a>
        <div class="admin-actions">
            <a href="log_recycle_bin.html" class="btn">Recycle Bin &rarr;</a>
            <button id="clear-logs-btn" class="btn btn--danger">Clear All Logs</button>
        </div>

        <!-- Form to log a new update -->
        <div id="log-update-section">
            <h2>Log a New Update</h2>
            <form id="log-form">
                <div class="form-group">
                    <label for="update_description">Update Description</label>
                    <textarea id="update_description" required placeholder="Describe the change you made (e.g., 'Updated the homepage hero image')."></textarea>
                </div>
                <button type="submit" class="btn">Log This Update</button>
                <p id="log-success" style="color: green; margin-top: 10px;"></p>
            </form>
        </div>

        <!-- Log History Section -->
        <div id="log-history-section" style="margin-top: 30px;">
            <h2>Update History</h2>
            <table id="log-table">
                <!-- Log history will be populated here -->
            </table>
        </div>
    </div>

    <script>
    const BASE_URL = "https://gmu-nav.onrender.com";

    document.addEventListener('DOMContentLoaded', async () => {
        // Authentication check
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'admin.html';
            return;
        }

        const logForm = document.getElementById('log-form');
        const logSuccessMessage = document.getElementById('log-success');
        const clearLogsBtn = document.getElementById('clear-logs-btn');

        // Fetch and display existing logs
        await fetchLogs();

        // Handle form submission for new logs
        logForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const description = document.getElementById('update_description').value;

            const response = await fetch(`${BASE_URL}/api/logs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description }),
            });

            if (response.ok) {
                logSuccessMessage.textContent = 'Update logged successfully!';
                logForm.reset();
                await fetchLogs(); 
                setTimeout(() => logSuccessMessage.textContent = '', 3000);
            } else {
                alert('Failed to log update.');
            }
        });

        clearLogsBtn.addEventListener('click', async () => {
            const isConfirmed = confirm('Are you sure you want to move all logs to the recycle bin?');
            if (isConfirmed) {
                try {
                    const response = await fetch(`${BASE_URL}/api/logs`, { method: 'DELETE' });
                    const result = await response.json();
                    alert(result.message);
                    if (response.ok) await fetchLogs(); 
                } catch (error) {
                    alert('An error occurred while clearing logs.');
                    console.error('Clear logs error:', error);
                }
            }
        });
    });

    async function fetchLogs() {
        const table = document.getElementById('log-table');
        try {
            const response = await fetch(`${BASE_URL}/api/logs`);
            if (!response.ok) throw new Error('Failed to fetch logs.');

            const result = await response.json();
            populateLogTable(result.data);
        } catch (error) {
            table.innerHTML = '<tr><td>Error loading update logs.</td></tr>';
            console.error('Fetch logs error:', error);
        }
    }

    function populateLogTable(logData) {
        const table = document.getElementById('log-table');
        let tableHTML = `
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Admin User</th>
                    <th>Description</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
        `;

        if (logData && logData.length > 0) {
            logData.forEach(item => {
                tableHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.admin_user}</td>
                        <td>${item.description}</td>
                        <td>${new Date(item.timestamp).toLocaleString()}</td>
                    </tr>
                `;
            });
        } else {
            tableHTML += `<tr><td colspan="4">No logs found.</td></tr>`;
        }

        tableHTML += '</tbody>';
        table.innerHTML = tableHTML;
    }
</script>

</body>
</html>
