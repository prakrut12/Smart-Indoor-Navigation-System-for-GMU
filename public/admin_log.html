<script>
const BASE_URL = "https://gmu-nav.onrender.com";

// 1️⃣ Load logs when page opens
document.addEventListener("DOMContentLoaded", () => {
    fetchLogs();

    document.getElementById("log-update-btn").addEventListener("click", logUpdate);
});

// 2️⃣ Log button function
async function logUpdate() {
    const description = document.getElementById("update_description").value.trim();

    if (!description) {
        alert("Please enter a description.");
        return;
    }

    try {
        const response = await fetch(`${BASE_URL}/api/logs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ description })
        });

        const result = await response.json();

        if (response.ok) {
            alert("Update logged successfully!");
            document.getElementById("update_description").value = "";
            fetchLogs(); // refresh table
        } else {
            alert(result.message || "Failed to log update.");
        }
    } catch (error) {
        alert("Error logging update.");
        console.error(error);
    }
}

// 3️⃣ Fetch logs from server
async function fetchLogs() {
    try {
        const response = await fetch(`${BASE_URL}/api/logs`);
        const result = await response.json();
        populateLogTable(result.data);
    } catch (error) {
        console.error("Fetch logs error:", error);
        document.getElementById("log-table").innerHTML =
            "<tr><td colspan='4'>Error loading logs.</td></tr>";
    }
}

// 4️⃣ Display logs on table
function populateLogTable(logs) {
    const table = document.getElementById("log-table");

    if (!logs || logs.length === 0) {
        table.innerHTML = "<tr><td colspan='4'>No update logs found.</td></tr>";
        return;
    }

    table.innerHTML = logs
        .map(log => `
            <tr>
                <td>${log.id}</td>
                <td>${log.admin_user}</td>
                <td>${log.description}</td>
                <td>${new Date(log.timestamp).toLocaleString()}</td>
            </tr>
        `)
        .join("");
}
</script>
