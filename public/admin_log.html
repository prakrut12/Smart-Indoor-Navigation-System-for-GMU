<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Update Log</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Admin Update Log</h1>
        <p>This page will show a history of all updates made by the admin.</p>

        <a href="admin.html" class="btn" style="margin-bottom: 20px; display: inline-block;">← Back to Feedback</a>

        <div class="admin-actions">
            <a href="log_recycle_bin.html" class="btn">Recycle Bin →</a>
            <button id="clear-logs-btn" class="btn btn--danger">Clear All Logs</button>
        </div>

        <!-- Log new update -->
        <div id="log-update-section">
            <h2>Log a New Update</h2>
            <form id="log-form">
                <div class="form-group">
                    <label for="update_description">Update Description</label>
                    <textarea id="update_description" required placeholder="Describe the change you made..."></textarea>
                </div>
                <button type="submit" class="btn">Log This Update</button>
            </form>
        </div>

        <!-- Log History -->
        <div id="log-history-section" style="margin-top: 30px;">
            <h2>Update History</h2>
            <table id="log-table"></table>
        </div>
    </div>

<script>
const BASE_URL = "https://smart-indoor-navigation-system-for-gmu.onrender.com";

document.addEventListener("DOMContentLoaded", () => {
    fetchLogs();   // <--- Load logs immediately when page opens
    document.getElementById("clear-logs-btn").addEventListener("click", clearLogs);
    
    // Add log submit handler
    document.getElementById("log-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        createLog();
    });
});

// Create new log entry
async function createLog() {
    const description = document.getElementById("update_description").value.trim();
    if (!description) return alert("Enter a description.");

    try {
        const res = await fetch(`${BASE_URL}/api/logs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ description })
        });

        const result = await res.json();
        alert(result.message);
        document.getElementById("log-form").reset();
        fetchLogs();   // refresh

    } catch (err) {
        console.error(err);
        alert("Error saving log.");
    }
}

// Clear Logs → move to recycle bin
async function clearLogs() {
    if (!confirm("Move ALL logs to recycle bin?")) return;

    try {
        const res = await fetch(`${BASE_URL}/api/logs`, { method: "DELETE" });
        const result = await res.json();
        alert(result.message);
        fetchLogs();   // refresh

    } catch (err) {
        console.error("Error:", err);
        alert("Error clearing logs.");
    }
}

// Fetch all logs
async function fetchLogs() {
    try {
        const res = await fetch(`${BASE_URL}/api/logs`);
        const result = await res.json();
        populateLogTable(result.data);
    } catch (err) {
        console.error(err);
    }
}

// Fill table
function populateLogTable(logs) {
    const table = document.getElementById("log-table");

    let html = `
        <thead>
            <tr>
                <th>Log ID</th>
                <th>Admin User</th>
                <th>Description</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
    `;

    if (!logs || logs.length === 0) {
        html += `<tr><td colspan="4">No logs found.</td></tr>`;
    } else {
        logs.forEach(row => {
            html += `
            <tr>
                <td>${row.id}</td>
                <td>${row.admin_user}</td>
                <td>${row.description}</td>
                <td>${new Date(row.timestamp).toLocaleString()}</td>
            </tr>`;
        });
    }

    html += "</tbody>";
    table.innerHTML = html;
}
</script>
</body>
</html>
