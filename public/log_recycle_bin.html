<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Log Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Update Log Recycle Bin</h1>
        <p>These logs have been cleared. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin_log.html" class="btn">&larr; Back to Update Log</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Admin User</th>
                    <th>Description</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
const BASE_URL = "https://smart-indoor-navigation-system-for-gmu.onrender.com";

document.addEventListener("DOMContentLoaded", () => {
    fetchDeletedLogs();

    document.getElementById("empty-bin-btn").addEventListener("click", emptyRecycleBin);
});

async function fetchDeletedLogs() {
    try {
        const res = await fetch(`${BASE_URL}/api/logs/recyclebin`);
        const result = await res.json();
        populateLogTable(result.data);
    } catch (err) {
        console.error(err);
        document.querySelector("#recycle-bin-table tbody").innerHTML =
            "<tr><td colspan='5'>Error loading logs.</td></tr>";
    }
}

function populateLogTable(data) {
    const tbody = document.querySelector("#recycle-bin-table tbody");

    if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5'>Recycle bin empty.</td></tr>";
        return;
    }

    tbody.innerHTML = data
        .map(
            item => `
        <tr>
            <td>${item.id}</td>
            <td>${item.admin_user}</td>
            <td>${item.description}</td>
            <td>${new Date(item.timestamp).toLocaleString()}</td>
            <td><button onclick="restoreLog(${item.id})">Restore</button></td>
        </tr>`
        )
        .join("");
}

async function restoreLog(id) {
    await fetch(`${BASE_URL}/api/logs/recyclebin/restore/${id}`, { method: "POST" });
    fetchDeletedLogs();
}

async function emptyRecycleBin() {
    if (!confirm("Are you sure you want to permanently delete all logs?")) return;

    await fetch(`${BASE_URL}/api/logs/recyclebin/empty`, { method: "DELETE" });
    fetchDeletedLogs();
}
</script>

</body>
</html>
