<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Log Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Update Log Recycle Bin</h1>
        <p>These logs have been cleared. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin_log.html" class="btn">&larr; Back to Update Log</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Admin User</th>
                    <th>Description</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
const BASE_URL = "https://gmu-nav.onrender.com";  // YOUR LIVE BACKEND

document.addEventListener("DOMContentLoaded", () => {
    if (sessionStorage.getItem("isAdminLoggedIn") !== "true") {
        window.location.href = "admin.html";
        return;
    }

    fetchRecycledItems();

    document.getElementById("empty-bin-btn").addEventListener("click", async () => {
        if (!confirm("Permanently delete ALL logs?")) return;

        try {
            const response = await fetch(`${BASE_URL}/api/logs/recyclebin/empty`, {
                method: "DELETE"
            });
            const result = await response.json();
            alert(result.message);
            fetchRecycledItems();
        } catch (err) {
            alert("Error emptying recycle bin.");
            console.error(err);
        }
    });
});

// Fetch deleted logs
async function fetchRecycledItems() {
    try {
        const response = await fetch(`${BASE_URL}/api/logs/recyclebin`);
        const result = await response.json();
        populateRecycleBinTable(result.data);
    } catch (err) {
        document.querySelector("#recycle-bin-table tbody").innerHTML =
            "<tr><td colspan='5'>Error loading items.</td></tr>";
        console.error(err);
    }
}

// Build rows
function populateRecycleBinTable(data) {
    const tbody = document.querySelector("#recycle-bin-table tbody");

    if (!data || data.length === 0) {
        tbody.innerHTML =
            "<tr><td colspan='5' style='text-align:center;'>Recycle bin is empty.</td></tr>";
        return;
    }

    tbody.innerHTML = data.map(item => `
        <tr>
            <td>${item.id}</td>
            <td>${item.admin_user}</td>
            <td>${item.description}</td>
            <td>${new Date(item.timestamp).toLocaleString()}</td>
            <td>
                <button class="btn btn--sm" onclick="restoreItem(${item.id})">Restore</button>
            </td>
        </tr>
    `).join("");
}

// Restore log
async function restoreItem(id) {
    try {
        const response = await fetch(`${BASE_URL}/api/logs/recyclebin/restore/${id}`, {
            method: "POST"
        });
        const result = await response.json();

        if (response.ok) {
            alert("Restored!");
            fetchRecycledItems();
        } else {
            alert(result.message || "Failed to restore.");
        }
    } catch (err) {
        alert("Error restoring log.");
        console.error(err);
    }
}
</script>

</body>
</html>
