<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Log Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Update Log Recycle Bin</h1>
        <p>These logs have been cleared. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin_log.html" class="btn">&larr; Back to Update Log</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Admin User</th>
                    <th>Description</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Authentication check
            if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
                window.location.href = 'admin.html';
                return;
            }

            const emptyBinBtn = document.getElementById('empty-bin-btn');
            fetchRecycledItems();

            emptyBinBtn.addEventListener('click', async () => {
                const isConfirmed = confirm('Are you sure you want to PERMANENTLY DELETE all items in the log recycle bin? This action cannot be undone.');
                if (isConfirmed) {
                    try {
                        const response = await fetch('http://localhost:3000/api/logs/recyclebin/empty', { method: 'DELETE' });
                        const result = await response.json();
                        alert(result.message);
                        fetchRecycledItems(); // Refresh the view
                    } catch (error) {
                        alert('An error occurred while emptying the recycle bin.');
                        console.error('Empty bin error:', error);
                    }
                }
            });
        });

        async function fetchRecycledItems() {
            try {
                const response = await fetch('http://localhost:3000/api/logs/recyclebin');
                const result = await response.json();
                populateRecycleBinTable(result.data);
            } catch (error) {
                document.getElementById('recycle-bin-table').innerHTML = '<tr><td colspan="5">Error loading items.</td></tr>';
                console.error('Fetch recycle bin error:', error);
            }
        }

        function populateRecycleBinTable(data) {
            const tableBody = document.querySelector('#recycle-bin-table tbody');
            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Log recycle bin is empty.</td></tr>';
                return;
            }

            tableBody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.admin_user}</td>
                    <td>${item.description}</td>
                    <td>${new Date(item.timestamp).toLocaleString()}</td>
                    <td>
                        <button class="btn btn--sm" onclick="restoreItem(${item.id})">Restore</button>
                    </td>
                </tr>
            `).join('');
        }

        async function restoreItem(id) {
            try {
                const response = await fetch(`http://localhost:3000/api/logs/recyclebin/restore/${id}`, { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    fetchRecycledItems(); // Refresh the list
                } else {
                    alert(result.message || 'Failed to restore item.');
                }
            } catch (error) {
                alert('An error occurred during restoration.');
                console.error('Restore error:', error);
            }
        }
    </script>
</body>
</html>
