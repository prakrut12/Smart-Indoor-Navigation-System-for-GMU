<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Log Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Update Log Recycle Bin</h1>
        <p>These logs have been cleared. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin_log.html" class="btn">&larr; Back to Update Log</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>Admin User</th>
                    <th>Description</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

<script>
const BASE_URL = "https://gmu-nav.onrender.com";

document.addEventListener('DOMContentLoaded', () => {

    // Prevent access without login
    if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
        window.location.href = 'admin.html';
        return;
    }

    fetchRecycledItems();

    // Empty Recycle Bin button
    document.getElementById("empty-bin-btn").addEventListener("click", async () => {
        const confirmDelete = confirm("Are you sure you want to permanently delete ALL logs?");
        if (!confirmDelete) return;

        try {
            const response = await fetch(`${BASE_URL}/api/logs/deleted`, {
                method: "DELETE"
            });

            const result = await response.json();
            alert(result.message);
            fetchRecycledItems();
        } catch (error) {
            alert("Error emptying recycle bin.");
            console.error(error);
        }
    });
});

// Fetch all deleted logs
async function fetchRecycledItems() {
    try {
        const response = await fetch(`${BASE_URL}/api/logs/deleted`);
        const result = await response.json();

        populateRecycleBinTable(result.data);
    } catch (error) {
        document.querySelector("#recycle-bin-table tbody").innerHTML =
            "<tr><td colspan='5'>Error loading items.</td></tr>";
        console.error("Fetch recycle bin error:", error);
    }
}

// Load table
function populateRecycleBinTable(data) {
    const tableBody = document.querySelector("#recycle-bin-table tbody");

    if (!data || data.length === 0) {
        tableBody.innerHTML =
            "<tr><td colspan='5' style='text-align:center;'>Recycle bin is empty.</td></tr>";
        return;
    }

    tableBody.innerHTML = data
        .map(
            (item) => `
        <tr>
            <td>${item.id}</td>
            <td>${item.admin_user}</td>
            <td>${item.description}</td>
            <td>${new Date(item.timestamp).toLocaleString()}</td>
            <td>
                <button class="btn btn--sm" onclick="restoreItem(${item.id})">Restore</button>
            </td>
        </tr>`
        )
        .join("");
}

// Restore log
async function restoreItem(id) {
    try {
        const response = await fetch(`${BASE_URL}/api/logs/restore/${id}`, {
            method: "POST",
        });

        const result = await response.json();

        if (response.ok) {
            alert("Log restored successfully!");
            fetchRecycledItems();
        } else {
            alert(result.message || "Failed to restore.");
        }
    } catch (error) {
        alert("Error restoring item.");
        console.error(error);
    }
}
</script>

</body>
</html>
