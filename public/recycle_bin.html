<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Recycle Bin</h1>
        <p>Items here have been removed from the main feedback view. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin.html" class="btn">&larr; Back to Feedback</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Rating</th>
                    <th>Feedback</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
const BASE_URL = "https://smart-indoor-navigation-system-for-gmu.onrender.com";

document.addEventListener("DOMContentLoaded", () => {
    fetchDeletedFeedback();
});

async function fetchDeletedFeedback() {
    try {
        const res = await fetch(`${BASE_URL}/api/feedback/recyclebin`);
        const result = await res.json();
        populateFeedbackTable(result.data);
    } catch (err) {
        console.error(err);
        document.querySelector("#recycle-bin-table tbody").innerHTML =
            "<tr><td colspan='5'>Error loading items.</td></tr>";
    }
}

function populateFeedbackTable(data) {
    const tbody = document.querySelector("#recycle-bin-table tbody");

    if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5'>Recycle bin empty.</td></tr>";
        return;
    }

    tbody.innerHTML = data
        .map(
            item => `
        <tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.rating}</td>
            <td>${item.feedback}</td>
            <td>
                <button onclick="restoreItem(${item.id})">Restore</button>
            </td>
        </tr>`
        )
        .join("");
}

async function restoreItem(id) {
    await fetch(`${BASE_URL}/api/feedback/recyclebin/restore/${id}`, { method: "POST" });
    fetchDeletedFeedback();
}

</script>

</body>
</html>
