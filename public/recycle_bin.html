<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recycle Bin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Recycle Bin</h1>
        <p>Items here have been removed from the main feedback view. You can restore them or delete them permanently.</p>
        
        <div class="admin-actions">
            <a href="admin.html" class="btn">&larr; Back to Feedback</a>
            <button id="empty-bin-btn" class="btn btn--danger">Empty Recycle Bin</button>
        </div>

        <table id="recycle-bin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Rating</th>
                    <th>Feedback</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
const BASE_URL = "https://smart-indoor-navigation-system-for-gmu.onrender.com";

document.addEventListener("DOMContentLoaded", () => {

    // Check login
    if (sessionStorage.getItem("isAdminLoggedIn") !== "true") {
        window.location.href = "admin.html";
        return;
    }

    const emptyBinBtn = document.getElementById("empty-bin-btn");

    fetchRecycledItems();

    emptyBinBtn.addEventListener("click", async () => {
        if (!confirm("Are you sure you want to permanently empty the recycle bin?")) return;
        
        try {
            const res = await fetch(`${BASE_URL}/api/feedback/recyclebin/empty`, {
                method: "DELETE"
            });
            const result = await res.json();
            alert(result.message);
            fetchRecycledItems();
        } catch (err) {
            console.error("Empty bin error:", err);
            alert("Error emptying recycle bin.");
        }
    });
});

async function fetchRecycledItems() {
    try {
        const response = await fetch(`${BASE_URL}/api/feedback/recyclebin`);
        const result = await response.json();
        populateRecycleBinTable(result.data);
    } catch (error) {
        document.querySelector("#recycle-bin-table tbody").innerHTML =
            "<tr><td colspan='5'>Error loading items.</td></tr>";
        console.error("Fetch recycle bin error:", error);
    }
}

function populateRecycleBinTable(data) {
    const tbody = document.querySelector("#recycle-bin-table tbody");

    if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5'>Recycle bin is empty.</td></tr>";
        return;
    }

    tbody.innerHTML = data
        .map(
            item => `
        <tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.email}</td>
            <td>${item.feedback}</td>
            <td>${new Date(item.submitted_at).toLocaleString()}</td>
        </tr>`
        )
        .join("");
}
</script>

</body>
</html>
